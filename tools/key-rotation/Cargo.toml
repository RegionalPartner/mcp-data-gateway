[package]
name = "key-rotation"
version = "0.1.0"
edition = "2021"
description = "AES-256-GCM key rotation CLI for document_chunks.encrypted_content"

[[bin]]
name = "key-rotation"
path = "src/main.rs"

[dependencies]
# AES-256-GCM — ring is the FIPS-audited choice; NOT aes-gcm (incompatible ABI)
ring = "0.17"

# PostgreSQL async I/O — runtime-tokio-rustls avoids OpenSSL for static musl build
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# Hex encoding/decoding for keys
hex = "0.4"

# Terminal progress bar
indicatif = "0.17"

# TEI HTTP client (rustls-tls = no OpenSSL; default-features = false removes native-tls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# JSON serialisation for embed request/response
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ergonomic error handling
anyhow = "1"

# UUID support
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
