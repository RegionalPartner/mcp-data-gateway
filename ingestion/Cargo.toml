[package]
name = "ingestion"
version = "0.1.0"
edition = "2021"
description = "SharePoint → PostgreSQL ingestion daemon for MCP Data Gateway (Phase 3)"

[[bin]]
name = "ingestion"
path = "src/main.rs"

# -----------------------------------------------------------------------------
# Feature flags — PR5 / D4 PII sanitization (default OFF).
# -----------------------------------------------------------------------------
# CI builds must NOT pull these dependencies by default — especially
# `sanitize-ner` which transitively downloads a 270 MB distilbert model at
# runtime and builds candle + tokenizers at compile time.
#
#   cargo test                              # baseline; Cow::Borrowed fast-path
#   cargo test --features sanitize-regex    # pure-regex scanner
#   cargo test --features sanitize-vault    # scanner + DB-backed tokenization
#   cargo test --features sanitize          # full stack (scanner + NER + vault)
#
# `sanitize` is the umbrella flag that turns all three sub-features on.
[features]
default = []
sanitize         = ["sanitize-regex", "sanitize-ner", "sanitize-vault"]
sanitize-regex   = ["dep:regex", "dep:once_cell"]
sanitize-ner     = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
sanitize-vault   = ["dep:aes-gcm", "dep:hmac", "dep:sha2", "dep:rand", "dep:unicode-normalization"]

[dependencies]
# AES-256-GCM — wire-format byte-compatible with ContentEncryptor.java (SEC-ENC).
# MUST use ring (not aes-gcm) to maintain FIPS-audited crypto consistency with the gateway.
ring = "0.17"

# PostgreSQL async I/O — runtime-tokio-rustls avoids OpenSSL for static musl builds.
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid"] }

# Async runtime.
tokio = { version = "1", features = ["full"] }

# CLI argument parsing.
clap = { version = "4", features = ["derive", "env"] }

# HTTP client — rustls-tls only, no OpenSSL, compatible with musl static build.
# Used for: Microsoft Graph API, TEI embeddings, SharePoint file downloads.
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# TODO(tokenizer): replace character-based chunking with the HuggingFace tokenizers crate
# (bert-base-uncased, 512-token windows, 50-token overlap) once crates.io fixes the compile
# bug where tokenizers ≤0.20 unconditionally imports the C `onig` crate even without the
# `onig` feature enabled.  Track: https://github.com/huggingface/tokenizers/issues (onig)

# JSON serialisation.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Ergonomic error handling.
anyhow = "1"

# Hex encoding for key parsing.
hex = "0.4"

# UUID for new chunk IDs.
uuid = { version = "1", features = ["v4"] }

# Structured logging.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# SourceConnector trait support.
async-trait = "0.1"
thiserror = "2"

# Zoho connector (PR3/D2): wait-free token cache.
arc-swap = "1"

# Zoho connector (PR3/D2): content-hash dedup.
blake3 = "1"

# Zoho connector (PR3/D2): temporary file spill for large downloads.
tempfile = "3"

# Zoho connector (PR3/D2): URL parsing for redirect-hop host validation.
url = "2"

# Zoho connector (PR3/D2): async stream utilities for chunked download body.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# -----------------------------------------------------------------------------
# PR5/D4 — PII sanitization (feature-gated; default OFF).
# -----------------------------------------------------------------------------
# Regex scan: FR NIR (Luhn-97), FR/EU IBAN (mod-97), E.164, email, UUID.
regex                = { version = "1.12",  optional = true }
once_cell            = { version = "1",     optional = true }

# NER scan: Davlan/distilbert-base-multilingual-cased-ner-hrl (270 MB fp32).
# `hf-hub` downloads the model on first use — opt-in only.
candle-core          = { version = "0.9",   optional = true }
candle-nn            = { version = "0.9",   optional = true }
candle-transformers  = { version = "0.9",   optional = true }
tokenizers           = { version = "0.21",  optional = true, default-features = false, features = ["fancy-regex"] }
hf-hub               = { version = "0.3",   optional = true }

# Vault: AES-256-GCM (original_value_ct) + HMAC-SHA256 (lookup_hash) +
# Unicode normalization for PER/ORG entity values.  sqlx is already a
# non-optional top-level dep, so it isn't listed here.
aes-gcm              = { version = "0.10",  optional = true }
hmac                 = { version = "0.12",  optional = true }
sha2                 = { version = "0.10",  optional = true }
rand                 = { version = "0.8",   optional = true }
unicode-normalization = { version = "0.1",  optional = true }

[dev-dependencies]
# Mock HTTP server for connector unit tests (no live HTTP in tests).
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
