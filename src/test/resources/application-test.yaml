spring:
  jpa:
    show-sql: false
  flyway:
    placeholders:
      hmacPepper: test-pepper-32-chars-minimum-000

mcp:
  security:
    enforce-tls: false  # Testcontainers uses plain HTTP — TLS validation disabled
    rate-limit:
      max-requests: 300  # Multiple IT classes share the same Spring context and accumulate requests
  hmac:
    pepper: test-pepper-32-chars-minimum-000
  content:
    key: "0101010101010101010101010101010101010101010101010101010101010101"
  oauth:
    issuer: http://localhost
    jwt-secret: test-jwt-secret-32-chars-minimum-00

logging:
  level:
    io.ancoris.mcp: DEBUG
