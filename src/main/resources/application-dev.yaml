spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mcpgateway}
    username: ${DB_USER:mcpuser}
    password: ${DB_PASSWORD:mcppass}
  jpa:
    show-sql: true

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: mcp-documents

mcp:
  security:
    enforce-tls: false  # dev uses plain HTTP — TLS validation disabled

logging:
  level:
    io.ancoris.mcp: DEBUG
    org.springframework.ai: DEBUG
    org.springframework.security: DEBUG
