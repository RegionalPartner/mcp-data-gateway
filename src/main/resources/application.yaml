spring:
  application:
    name: mcp-data-gateway
  ai:
    mcp:
      server:
        enabled: true
        name: mcp-data-gateway
        version: 1.0.0
        transport: streamable-http
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db

minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:mcp-documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

server:
  port: 8080
  error:
    include-message: never      # SEC-012: never expose exception messages to clients
    include-stacktrace: never

mcp:
  security:
    enforce-tls: true   # SEC-010: set false only in dev/test profiles

logging:
  level:
    io.ancoris.mcp: INFO
    org.springframework.ai: INFO
