spring:
  application:
    name: mcp-data-gateway
  ai:
    mcp:
      server:
        enabled: true
        name: mcp-data-gateway
        version: 1.0.0
        protocol: STREAMABLE
    openai:
      base-url: ${TEI_BASE_URL:http://tei:8080}
      api-key: none      # TEI does not require an API key
  threads:
    virtual:
      enabled: true      # JEP 491 — virtual threads safe on JDK 25 (no pinning risk)
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false   # stateless REST/MCP API — OSIV anti-pattern disabled
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db
    placeholders:
      hmacPepper: ${MCP_HMAC_PEPPER:dev-only-pepper-NOT-for-production-1234}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,sbom
  endpoint:
    health:
      show-details: when_authorized

server:
  # SEC-013: unwrap X-Forwarded-For from RFC1918 proxies (nginx-ingress pods are 10.x.x.x)
  # Without this, RateLimiterFilter sees the nginx pod IP for every client instead of the real IP
  forward-headers-strategy: native
  error:
    include-message: never      # SEC-012: never expose exception messages to clients
    include-stacktrace: never

mcp:
  security:
    enforce-tls: true   # SEC-010: set false only in dev/test profiles
  hmac:
    pepper: ${MCP_HMAC_PEPPER}
  content:
    key: ${MCP_CONTENT_KEY}
  oauth:
    issuer: ${MCP_OAUTH_ISSUER:https://mcp.37.59.24.118.nip.io}
    jwt-secret: ${MCP_JWT_SECRET}

logging:
  level:
    io.ancoris.mcp: INFO
    org.springframework.ai: INFO
