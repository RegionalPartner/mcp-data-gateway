apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: mcp-demo
  labels:
    app: mcp-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-gateway
  template:
    metadata:
      labels:
        app: mcp-gateway
    spec:
      serviceAccountName: mcp-gateway
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: log-dir
          emptyDir: {}
      containers:
        - name: mcp-gateway
          image: ghcr.io/regionalpartner/mcp-data-gateway:develop
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: mcp-gateway-config
                  key: spring-profiles-active
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: db-url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: db-password
            - name: MCP_HMAC_PEPPER
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: mcp-hmac-pepper
            - name: MCP_CONTENT_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: mcp-content-key
            - name: JAVA_TOOL_OPTIONS
              value: "-Djava.io.tmpdir=/tmp"
            - name: TEI_BASE_URL
              value: "http://tei:8080"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: log-dir
              mountPath: /var/log/mcp
