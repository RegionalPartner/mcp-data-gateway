apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway
  namespace: mcp-demo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SEC-004: force all HTTP traffic to HTTPS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # MCP session affinity: Spring AI stores the SSE emitter in JVM heap, making each
    # MCP session physically bound to one pod. We hash first by mcp-session-id (present
    # on all follow-up GET /mcp SSE and POST requests) and fall back to client IP for
    # the initial sessionless request. This routes every request in a session to the
    # same replica even when the caller (e.g. Anthropic/Toolbox vs Anthropic/ClaudeAI)
    # originates from different egress IPs.
    # NOTE: with replicas=1 this annotation is a no-op but kept for when a shared
    # session store (Redis) is added and replicas > 1 is safe again.
    # See docs/ARCHITECTURE.md § "Horizontal scaling and MCP session affinity".
    nginx.ingress.kubernetes.io/upstream-hash-by: "$http_mcp_session_id$remote_addr"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mcp.37.59.24.118.nip.io
      secretName: mcp-gateway-tls
  rules:
    - host: mcp.37.59.24.118.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-gateway
                port:
                  number: 80
