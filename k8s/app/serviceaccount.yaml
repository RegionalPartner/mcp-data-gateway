apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-gateway
  namespace: mcp-demo
  labels:
    app: mcp-gateway
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-gateway
  namespace: mcp-demo
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-gateway
  namespace: mcp-demo
subjects:
  - kind: ServiceAccount
    name: mcp-gateway
    namespace: mcp-demo
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: mcp-gateway
