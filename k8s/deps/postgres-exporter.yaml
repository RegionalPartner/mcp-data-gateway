---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: mcp-demo
  labels:
    app: postgres-exporter
spec:
  selector:
    app: postgres-exporter
  ports:
    - name: metrics
      port: 9187
      targetPort: 9187
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: mcp-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
          # Reuses mcpuser per the v1 plan — overprivileged for monitoring,
          # acceptable on a single-operator dev cluster. TODO: tighten to a
          # dedicated pg_monitor role when a second human joins the project.
          env:
            - name: DATA_SOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: db-user
            - name: DATA_SOURCE_PASS
              valueFrom:
                secretKeyRef:
                  name: mcp-gateway-secrets
                  key: db-password
            - name: DATA_SOURCE_URI
              value: "postgresql.mcp-demo.svc.cluster.local:5432/mcpgateway?sslmode=disable"
          ports:
            - name: metrics
              containerPort: 9187
          readinessProbe:
            httpGet: { path: /, port: 9187 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 9187 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { memory: "32Mi", cpu: "50m" }
            limits:   { memory: "64Mi", cpu: "100m" }
