name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC daily
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mcp-data-gateway:latest

jobs:

  trivy-scan:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  pitest:
    name: PIT Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Restore PIT history
        uses: actions/cache@v4
        with:
          path: build/pit-history
          key: pit-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pit-history-${{ runner.os }}-

      - name: Run PIT mutation tests
        run: ./gradlew pitest
        continue-on-error: true   # nightly — failures are informational, not blocking
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Upload PIT report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pit-report
          path: build/reports/pitest/
          retention-days: 30
