name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mcp-data-gateway

jobs:

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Run full build (test, Checkstyle, SpotBugs, JaCoCo)
        run: ./gradlew build
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          SKIP_REMOTE_E2E: "true"

      - name: Publish test results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: build/test-results/test/*.xml

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/test/

      - name: Upload SpotBugs reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spotbugs-reports
          path: build/reports/spotbugs/

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: Upload bootJar
        uses: actions/upload-artifact@v7
        with:
          name: boot-jar
          path: build/libs/*.jar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0

      - name: JaCoCo coverage PR comment
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.2
        with:
          paths: ${{ github.workspace }}/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 75
          min-coverage-changed-files: 80
          update-comment: true

  rust-tools:
    name: Rust Tools (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # key-rotation ──────────────────────────────────────────────────────────
      - name: key-rotation — fmt check
        run: cargo fmt --manifest-path tools/key-rotation/Cargo.toml -- --check

      - name: key-rotation — clippy
        run: cargo clippy --manifest-path tools/key-rotation/Cargo.toml -- -D warnings

      - name: key-rotation — tests
        run: cargo test --manifest-path tools/key-rotation/Cargo.toml

      # ingestion ─────────────────────────────────────────────────────────────
      - name: ingestion — fmt check
        run: cargo fmt --manifest-path ingestion/Cargo.toml -- --check

      - name: ingestion — clippy
        run: cargo clippy --manifest-path ingestion/Cargo.toml -- -D warnings

      - name: ingestion — tests
        # TOKENIZER_PATH unset → Chunker falls back to character-based mode.
        # All chunker tests are written to pass without the tokenizer file.
        run: cargo test --manifest-path ingestion/Cargo.toml

  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Restore OWASP NVD data cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/build.gradle.kts') }}
          restore-keys: owasp-nvd-${{ runner.os }}-

      - name: Run OWASP dependency check
        run: ./gradlew dependencyCheckAnalyze --no-configuration-cache
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        continue-on-error: ${{ github.event_name == 'pull_request' }}

      - name: Upload OWASP report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-report
          path: |
            build/reports/dependency-check-report.html
            build/reports/dependency-check-report.json

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  container-build-and-scan:
    name: Container Build and Trivy Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Download bootJar
        uses: actions/download-artifact@v7
        with:
          name: boot-jar
          path: build/libs/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image (local only)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: mcp-gateway:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan (gate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: mcp-gateway:test
          format: table
          exit-code: '1'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Run Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        if: always()
        with:
          image-ref: mcp-gateway:test
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

      - name: Push image to ghcr.io
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to OVH (rolling)
    runs-on: ubuntu-latest
    needs: container-build-and-scan
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    environment: ovh-cluster
    permissions:
      contents: read
    steps:
      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.OVH_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Roll out new image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/mcp-data-gateway:sha-${SHORT_SHA}"
          echo "Deploying ${IMAGE}"
          kubectl set image deployment/mcp-gateway mcp-gateway="${IMAGE}" -n mcp-demo
          kubectl rollout status deployment/mcp-gateway -n mcp-demo --timeout=600s

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Download JaCoCo report
        uses: actions/download-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test/

      - name: SonarCloud analysis
        run: ./gradlew sonar --no-configuration-cache
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e-gate:
    name: Remote E2E Gate (OVH)
    runs-on: ubuntu-latest
    needs: deploy-dev
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Gradle wrapper execute permission
        run: chmod +x gradlew

      - name: Write kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.OVH_KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Resolve OVH cluster URL
        run: |
          IP=$(kubectl get svc ingress-nginx-controller -n ingress-nginx \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "OVH_BASE_URL=https://mcp.${IP}.nip.io" >> $GITHUB_ENV
          echo "Targeting ${IP} (mcp.${IP}.nip.io)"

      - name: Run remote E2E tests
        run: ./gradlew test --tests "io.ancoris.mcp.McpRemoteEndToEndIT"
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          OVH_BASE_URL: ${{ env.OVH_BASE_URL }}
          # SKIP_REMOTE_E2E intentionally absent — this job is the gate

      - name: Publish E2E results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: build/test-results/test/*.xml
          check_name: Remote E2E (OVH)
